

<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taxi TJ — Таксӣ дар Тоҷикистон</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f0f4f0;
  margin: 0;
  padding: 20px;
}
.box {
  max-width: 400px;
  margin: 30px auto;
  background: white;
  padding: 24px;
  border-radius: 18px;
  box-shadow: 0 4px 15px #cccccc;
}
h1 { color: #159447; text-align: center; }
p { text-align: center; }
input, button {
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  margin-top: 12px;
  border-radius: 9px;
  font-size: 16px;
}
input { border: 1px solid #cccccc; }
button {
  background: #159447;
  color: white;
  border: none;
  font-weight: bold;
}
</style>
</head>
<body>
<div class="box">
<h1>🚕 Taxi TJ</h1>
<p>Хуш омадед! Таксиро фармоиш диҳед.</p>
<input id="from" placeholder="Аз куҷо меравед?">
<input id="to" placeholder="Ба куҷо меравед?">
<input id="phone" placeholder="Рақами телефони шумо">
<button onclick="orderTaxi()">Фармоиш додан</button>
<p id="result"></p>
</div>
<script>
function orderTaxi() {
  const from = document.getElementById('from').value.trim();
  const to = document.getElementById('to').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const result = document.getElementById('result');
  if (!from || !to || !phone) {
    result.textContent = 'Лутфан, ҳамаи ҷойҳоро пур кунед.';
    return;
  }
  result.textContent = 'Намунаи сайт: фармоиши шумо омода аст. Барои фиристодани фармоиш ба ронанда, пайваст кардани хизматрасонӣ лозим аст.';
}
</script>
</body>
</html>
